services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: interview_coach
      POSTGRES_USER: interview_coach
      POSTGRES_PASSWORD: interview_coach
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interview_coach -d interview_coach"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
