<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Feedback</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
<div class="container">
    <h1>Answer Feedback</h1>

    <div class="card">
        <h2>Selected Question</h2>
        <p th:text="${selectedQuestion}"></p>
    </div>

    <div class="card">
        <h2>Your Answer</h2>
        <p th:text="${userAnswer}"></p>
    </div>

    <div class="card">
        <h2>AI Feedback</h2>
        <p><strong>Score:</strong> <span th:text="${feedback.score}"></span></p>
        <p><strong>Strengths:</strong> <span th:text="${feedback.strengths}"></span></p>
        <p><strong>Missing Points:</strong> <span th:text="${feedback.missingPoints}"></span></p>
        <p><strong>Improvement Tips:</strong> <span th:text="${feedback.improvementTips}"></span></p>
    </div>

    <div class="card">
        <a href="/">Start Again</a>
    </div>
</div>
</body>
</html>
