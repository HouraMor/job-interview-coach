spring.application.name=jobinterviewcoach
spring.application.name=jobinterviewcoach

server.port=${PORT:8080}

ai.api.key=${GROQ_API_KEY:}
ai.base.url=https://api.groq.com/openai/v1
ai.model=openai/gpt-oss-20b

app.input.max-cv-characters=${MAX_CV_CHARACTERS:20000}
app.input.max-job-characters=${MAX_JOB_CHARACTERS:20000}
app.input.max-answer-characters=${MAX_ANSWER_CHARACTERS:10000}
app.input.max-pdf-bytes=${MAX_PDF_BYTES:5242880}
app.rate-limit.request-limit=${RATE_LIMIT_REQUESTS:10}
app.rate-limit.window-seconds=${RATE_LIMIT_WINDOW_SECONDS:60}

app.admin.username=${APP_ADMIN_USERNAME}
app.admin.password=${APP_ADMIN_PASSWORD}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:interview_coach}${DB_JDBC_PARAMETERS:}
spring.datasource.username=${DB_USER:interview_coach}
spring.datasource.password=${DB_PASSWORD:interview_coach}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.servlet.multipart.max-file-size=${MAX_PDF_BYTES:5242880}B
spring.servlet.multipart.max-request-size=${MAX_MULTIPART_REQUEST_BYTES:11534336}B

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

spring.jpa.open-in-view=false

management.endpoints.access.default=none
management.endpoint.health.access=read-only
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
